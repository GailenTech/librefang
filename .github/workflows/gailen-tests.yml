name: Gailen — suite de tests

# Ejecuta la suite del workspace (y los tests #[ignore] que ejecuta kernel-ignored-tests.yml de upstream) sobre cualquier ref del fork.
# Perfil de test (dev), no el release con lto=fat. Se lanza a mano:
#   gh workflow run gailen-tests.yml --ref gailen/ci-tests -f ref=<rama o SHA>
# Para separar fallos previos de fallos del parche se lanza dos veces: con la base (1f2a24d3f) y con la rama del parche.
# GitHub solo deja lanzar workflow_dispatch si el fichero esta en la rama por defecto, y no queremos tocar la main del fork:
# por eso tambien arranca con cada push a gailen/ci-tests, leyendo las ejecuciones de ci-runs.json (una entrada = un trabajo de la matriz).
# Con "mutant" se aplica antes de compilar mutantes/<nombre>.patch (de esta rama) al ref probado, para comprobar que un test falla cuando el defecto existe.
on:
  push:
    branches: [gailen/ci-tests]
    paths: [ci-runs.json, .github/workflows/gailen-tests.yml, mutantes/**]
  workflow_dispatch:
    inputs:
      ref:
        description: Rama, etiqueta o SHA del fork a probar
        required: true
        default: gailen/mcp-concurrencia-tests
      scope:
        description: workspace = cargo test --workspace; custom = los argumentos de cargo_args
        type: choice
        options: [workspace, custom]
        default: workspace
      cargo_args:
        description: Con scope=custom, argumentos de cargo test (p. ej. "-p librefang-runtime-mcp")
        default: ""
      ignored:
        description: Ejecutar tambien el test #[ignore] de kernel-ignored-tests.yml
        type: boolean
        default: true
      mutant:
        description: Nombre (sin .patch) de un parche de mutantes/ que se aplica antes de compilar
        default: ""
      runner:
        description: Runner
        default: ubuntu-24.04-arm
      recursion_fix:
        description: Ficheros (separados por espacios) a los que se antepone #![recursion_limit = "256"] antes de compilar; solo para poder construir la suite
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  LIBREFANG_REGISTRY_OFFLINE: "1"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: m
        env:
          EVENT: ${{ github.event_name }}
          I_REF: ${{ inputs.ref }}
          I_SCOPE: ${{ inputs.scope }}
          I_ARGS: ${{ inputs.cargo_args }}
          I_IGNORED: ${{ inputs.ignored }}
          I_MUTANT: ${{ inputs.mutant }}
          I_RUNNER: ${{ inputs.runner }}
          I_RECFIX: ${{ inputs.recursion_fix }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            M=$(jq -nc --arg ref "$I_REF" --arg scope "$I_SCOPE" --arg args "$I_ARGS" --arg ignored "$I_IGNORED" --arg mutant "$I_MUTANT" --arg runner "$I_RUNNER" --arg recfix "$I_RECFIX" \
              '{include:[{ref:$ref,scope:$scope,cargo_args:$args,ignored:($ignored=="true"),mutant:$mutant,runner:$runner,recursion_fix:$recfix}]}')
          else
            M=$(jq -c '{include: map({ref, scope: (.scope // "workspace"), cargo_args: (.cargo_args // ""), ignored: (.ignored // false), mutant: (.mutant // ""), runner: (.runner // "ubuntu-24.04-arm"), recursion_fix: (.recursion_fix // "")})}' ci-runs.json)
          fi
          echo "$M"
          echo "matrix=$M" >> "$GITHUB_OUTPUT"

  tests:
    needs: plan
    name: ${{ matrix.scope }} @ ${{ matrix.ref }} ${{ matrix.mutant }} ${{ matrix.cargo_args }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      M_REF: ${{ matrix.ref }}
      M_SCOPE: ${{ matrix.scope }}
      M_ARGS: ${{ matrix.cargo_args }}
      M_MUTANT: ${{ matrix.mutant }}
      M_RECFIX: ${{ matrix.recursion_fix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: .gailen-ci
      - name: Parche de mutante
        if: matrix.mutant != ''
        run: |
          git apply --verbose ".gailen-ci/mutantes/${M_MUTANT}.patch"
          git diff --stat
      - name: Limite de recursion (solo para poder compilar la suite)
        if: matrix.recursion_fix != ''
        run: |
          for f in $M_RECFIX; do sed -i '1i #![recursion_limit = "256"]' "$f"; head -3 "$f"; done
      - name: Liberar disco
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Swap
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 16G /gailen-swap
          sudo chmod 600 /gailen-swap && sudo mkswap /gailen-swap >/dev/null && sudo swapon /gailen-swap
          free -h
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@a45951ff880207c249adf57334cf2e9bd81d6e1e # v2
        with:
          shared-key: gailen-tests-${{ runner.arch }}
          workspaces: ". -> target"
      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf libdbus-1-dev libsecret-1-dev pkg-config
      - name: Directorio del dashboard
        run: mkdir -p crates/librefang-api/static/react
      - name: Compilar los tests
        run: |
          set -o pipefail
          if [ "$M_SCOPE" = "workspace" ]; then ARGS="--workspace"; else ARGS="$M_ARGS"; fi
          # Lo que va tras " -- " son filtros del ejecutable de tests, no de cargo: no cuenta para compilar.
          PRE="${ARGS%% -- *}"
          echo "cargo test $PRE --no-run"
          if [ "$M_SCOPE" = "workspace" ]; then
            # --keep-going (que cargo test no tiene) enumera todos los errores de compilacion en una sola pasada; los artefactos son los mismos que los de cargo test --no-run.
            cargo build --workspace --tests --keep-going -j 3 2>&1 | tee build.log
          else
            cargo test $PRE --no-run -j 3 2>&1 | tee build.log
          fi
      - name: Ejecutar los tests
        run: |
          set -o pipefail
          if [ "$M_SCOPE" = "workspace" ]; then ARGS="--workspace"; else ARGS="$M_ARGS"; fi
          PRE="${ARGS%% -- *}"
          POST=""
          case "$ARGS" in *" -- "*) POST="${ARGS#* -- }" ;; esac
          cargo test $PRE --no-fail-fast -- $POST 2>&1 | tee test.log
      - name: Test ignorado de kernel-ignored-tests.yml
        if: always() && matrix.ignored && matrix.scope == 'workspace'
        run: |
          set -o pipefail
          cargo test -p librefang-kernel --lib -- --ignored hand_runtime_override_survives_restart_via_start_background_agents 2>&1 | tee ignored.log
      - name: Resumen
        if: always()
        run: |
          {
            echo "## ref \`$M_REF\` ($(git rev-parse --short HEAD)) mutante \`$M_MUTANT\` $M_SCOPE $M_ARGS"
            echo
            echo "### Resultados por binario de test"
            echo '```'
            grep -E '^test result:' test.log 2>/dev/null | sort | uniq -c || true
            echo '```'
            echo "### Tests fallidos"
            echo '```'
            grep -E '^test .* FAILED$' test.log ignored.log 2>/dev/null | sort -u || true
            grep -E '^error: (test failed|could not compile)' build.log test.log ignored.log 2>/dev/null | sort -u || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Registros
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logs-${{ github.run_id }}-${{ strategy.job-index }}
          path: |
            build.log
            test.log
            ignored.log
          if-no-files-found: ignore
