name: Gailen — imagen base linux/arm64

# Compila el binario de esta rama dentro de bookworm y publica una imagen base en GHCR.
# La etiqueta lleva el SHA para no reescribir nunca una imagen ya publicada.
on:
  push:
    branches: ['gailen/ci-imagen']

permissions:
  contents: read
  packages: write

env:
  IMAGEN: ghcr.io/gailentech/librefang
  VERSION: 2026.10.16-mcp1

jobs:
  imagen:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Liberar disco
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup && df -h /
      # El perfil release es lto=fat con codegen-units=1: en el enlace final rustc supera la memoria del runner y muere por SIGKILL.
      - name: Swap
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 28G /gailen-swap
          sudo chmod 600 /gailen-swap && sudo mkswap /gailen-swap >/dev/null && sudo swapon /gailen-swap
          free -h && df -h /
      - name: Dashboard
        run: |
          docker run --rm -v "$PWD/crates/librefang-api":/api -w /api/dashboard node:22.23.3-alpine sh -c \
            'npm install --global corepack@0.34.6 && corepack enable && corepack prepare pnpm@12.6.0 --activate && pnpm install --frozen-lockfile --ignore-scripts && pnpm run build'
      - name: Binario
        run: |
          docker run --rm -v "$PWD":/work -w /work rust:1.95-slim-bookworm sh -c \
            'apt-get update -qq && apt-get install -y -qq --no-install-recommends build-essential pkg-config libssl-dev libdbus-1-dev perl ca-certificates >/dev/null && cargo build --release --bin librefang --locked && cp target/release/librefang deploy/gailen-ci/librefang-bin'
          sha256sum deploy/gailen-ci/librefang-bin
      - name: Imagen
        run: |
          docker build -t "$IMAGEN:$VERSION-ci-${GITHUB_SHA::9}" deploy/gailen-ci
          docker run --rm "$IMAGEN:$VERSION-ci-${GITHUB_SHA::9}" --version
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publicar
        run: |
          docker push "$IMAGEN:$VERSION-ci-${GITHUB_SHA::9}"
          docker inspect --format '{{index .RepoDigests 0}}' "$IMAGEN:$VERSION-ci-${GITHUB_SHA::9}" | tee -a "$GITHUB_STEP_SUMMARY"
