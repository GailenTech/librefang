name: Gailen — binario linux/arm64

# Compila el binario de la rama gailen/ci-imagen para la imagen zentzu-librefang (edgar es aarch64).
# Dentro de bookworm a propósito: la imagen final es debian:bookworm-slim y un enlazado contra la glibc del
# runner podría no arrancar allí. Solo deja el binario como artefacto; la imagen se monta aparte, porque el paquete
# de GHCR es privado y no está ligado a este fork.
on:
  push:
    branches: ['gailen/ci-imagen']

permissions:
  contents: read

jobs:
  binario:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Liberar disco
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup && df -h /
      - name: Dashboard
        run: |
          docker run --rm -v "$PWD/crates/librefang-api":/api -w /api/dashboard node:22.23.3-alpine sh -c \
            'npm install --global corepack@0.34.6 && corepack enable && corepack prepare pnpm@12.6.0 --activate && pnpm install --frozen-lockfile --ignore-scripts && pnpm run build'
      - name: Binario
        run: |
          docker run --rm -v "$PWD":/work -w /work rust:1.95-slim-bookworm sh -c \
            'apt-get update -qq && apt-get install -y -qq --no-install-recommends build-essential pkg-config libssl-dev libdbus-1-dev perl ca-certificates >/dev/null && cargo build --release --bin librefang --locked && cp target/release/librefang /work/librefang-bin'
      - name: Arranca en bookworm-slim
        run: |
          docker run --rm -v "$PWD/librefang-bin":/usr/local/bin/librefang:ro debian:bookworm-slim sh -c \
            'apt-get update -qq && apt-get install -y -qq --no-install-recommends libdbus-1-3 ca-certificates >/dev/null && librefang --version'
          sha256sum librefang-bin
      - uses: 
        with:
          name: librefang-linux-arm64
          path: librefang-bin
          retention-days: 7
          if-no-files-found: error
